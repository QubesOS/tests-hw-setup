PasswordAuthentication no
PrintLastLog no

Match User control
    AuthorizedKeysCommand /usr/local/bin/testbed-ssh-keys
    AuthorizedKeysCommandUser control

Match User test*
    AuthorizedKeysCommand /usr/local/bin/testbed-ssh-keys
    AuthorizedKeysCommandUser control
    PermitUserRC no
    DisableForwarding yes
    X11Forwarding no
    AllowTcpForwarding no
    PermitTTY no
    ForceCommand internal-sftp
    ChrootDirectory %h

Match User openqa-share
    PermitUserRC no
    DisableForwarding yes
    X11Forwarding no
    AllowTcpForwarding no
    PermitTTY no
    ForceCommand /usr/local/bin/sync-openqa-share
